<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Bureaux — Île Entrepreneuriale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Familjen+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4ecdc; --paper:#fbf6ec; --ink:#231c13; --muted:#76664f; --rule:#e2d4ba; --chip:#efe3cb; --night:#14202e; --gold:#f5d27a; --gold2:#b8891c;
  --ok:#2f7d4f; --warn:#b06a10; --bad:#b3261e; --info:#2d5d8a; --accent:var(--gold2);
  --display:"Caprasimo","Cooper Black",Georgia,serif; --body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--night);color:var(--paper)}
.top .in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{font:400 21px var(--display);text-decoration:none;white-space:nowrap}
.top nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.top nav a,.top input{color:var(--paper);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:5px 10px;font:600 12.5px var(--body);text-decoration:none}
.top input{min-width:180px}.top input::placeholder{color:#c9d2dc}
.ariane{max-width:1240px;margin:0 auto;padding:12px 16px 0;font:600 12.5px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ariane a{text-decoration:none;border-bottom:1px solid var(--rule)}.ariane span.sep{opacity:.5}
main{max-width:1240px;margin:0 auto;padding:10px 16px 70px;transition:opacity .25s ease,transform .25s ease}
main.sortie{opacity:0;transform:translateY(6px)}
.kicker{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:400 clamp(30px,5.5vw,48px)/1.05 var(--display);margin:6px 0 8px;display:flex;align-items:center;gap:12px}
h1 .pastille{width:18px;height:18px;border-radius:50%;flex:0 0 18px;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
h2{font:400 23px var(--display);margin:28px 0 8px}
.lead{max-width:820px;color:#3f3424;margin:0 0 10px}
.public{border:1.5px dashed var(--gold2);background:#fff8e6;border-radius:10px;padding:8px 12px;font-size:13.5px;margin:10px 0}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.carte{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;text-decoration:none;display:block;transition:border-color .15s,transform .15s}
a.carte:hover,a.carte:focus-visible{border-color:var(--gold2);transform:translateY(-1px);outline:none}
.carte .l{font:600 11.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.carte .v{font:400 28px var(--display);margin-top:2px}
.carte .s{font-size:13px;color:var(--muted)}
.salles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
.salle{display:flex;flex-direction:column;gap:2px;background:var(--night);color:var(--paper);border-radius:14px;padding:14px;text-decoration:none;min-height:96px;transition:transform .15s}
.salle:hover,.salle:focus-visible{transform:translateY(-2px);outline:3px solid var(--gold)}
.salle b{font:400 19px var(--display);color:var(--gold)}.salle span{font-size:13px;color:#cfd7e0}
.agent{display:flex;gap:12px;align-items:center}
.mono-av{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;font:600 15px var(--body);color:#fff}
.statut{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);border-radius:999px;padding:2px 9px;border:1px solid currentColor}
.statut::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-en_execution{color:var(--ok)}.st-en_reunion{color:var(--info)}.st-en_attente_validation{color:var(--warn)}.st-bloque{color:var(--bad)}
.st-suspendu{color:var(--bad)}.st-disponible{color:var(--muted)}.st-hors_ligne{color:#9a8c78}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:14px}
th{font:600 11.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--chip)}
.table{overflow-x:auto}
.vide{color:var(--muted);font-style:italic;padding:8px 0}
.tag{display:inline-block;font:600 11.5px var(--mono);background:var(--chip);border-radius:6px;padding:1px 7px;margin:1px 2px}
.alerte{border-left:4px solid var(--warn);background:#fff3e0;padding:8px 12px;border-radius:6px;margin:6px 0;font-size:14px}
.src{font:12px var(--mono);color:var(--muted)}
code{font:13px var(--mono);overflow-wrap:anywhere}
/* organigramme */
.oc-barre{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.oc-barre button,.oc-barre input{font:600 13px var(--body);border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 10px;cursor:pointer}
.oc{overflow:auto;border:1px solid var(--rule);border-radius:14px;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(0,0,0,.025) 23px 24px),var(--paper);height:62vh;cursor:grab;touch-action:pan-x pan-y}
.oc.saisi{cursor:grabbing}
.oc-plan{transform-origin:0 0;padding:28px;width:max-content}
.oc ul{list-style:none;margin:0;padding:0 0 0 30px;position:relative}
.oc>.oc-plan>ul{padding-left:0}
.oc li{position:relative;padding:8px 0 0 0}
.oc ul ul li::before{content:"";position:absolute;left:-18px;top:0;bottom:0;border-left:1.5px solid var(--rule)}
.oc ul ul li::after{content:"";position:absolute;left:-18px;top:30px;width:18px;border-top:1.5px solid var(--rule)}
.noeud{display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:8px 12px;min-width:230px;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.noeud:hover,.noeud:focus-visible{border-color:var(--gold2);outline:none}
.noeud.vacant{border-style:dashed;background:#fbf8f1}
.noeud.trouve{box-shadow:0 0 0 3px var(--gold)}
.plier{font:600 12px var(--mono);border:1px solid var(--rule);background:var(--chip);border-radius:6px;margin-left:6px;cursor:pointer;padding:1px 6px}
li.plie>ul{display:none}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
@media (max-width:640px){ h1{font-size:30px} .top input{min-width:0;width:100%} .noeud{min-width:190px} }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" id="n-acc" href="../../index.html">Île Entrepreneuriale</a>
  <nav aria-label="Navigation"><a id="n-met" href="index.html">← Métropole</a><a href="#/">Entreprises</a><a id="n-res" href="residence.html">Résidence</a></nav>
  <input id="cherche" type="search" placeholder="Chercher un agent, un poste…" aria-label="Chercher un collaborateur" list="annuaire">
  <datalist id="annuaire"></datalist>
</div></header>
<div class="ariane" id="ariane" aria-label="Fil d'Ariane"></div>
<main id="vue" aria-live="polite"><p class="vide">Chargement de l'organisation…</p></main>
<script src="source.js"></script>
<script src="entreprise.js"></script>
</body>
</html>
